<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comentarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">Comentarios de la Tarea</h2>
    <div id="comentarios" class="mb-4">
    </div>
    <div class="mb-3">
      <label for="input-comentario" class="form-label">Escribe un comentario</label>
      <textarea class="form-control" id="input-comentario" rows="3" placeholder="Tu comentario..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="agregarComentario()">Comentar</button>
  </div>

</body>
<script src="js/comments.js" defer></script>
</html>
